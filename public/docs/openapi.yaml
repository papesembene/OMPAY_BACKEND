openapi: 3.0.3
info:
  title: OMPAY API
  version: 1.0.0
  description: >
    API de paiement mobile simulant les fonctionnalités d’Orange Money :
    authentification, paiements, transferts et consultation de solde.

servers:
  - url: https://ompay-backend.onrender.com/api/v1
    description: Production
  - url: http://localhost:8000/api/v1
    description: Local

paths:
  /auth/request-otp:
    post:
      summary: Demander un OTP pour l'authentification 2FA
      tags:
        - Authentification
      parameters:
        - name: debug
          in: query
          description: Mode debug pour afficher l'OTP en production (uniquement pour tests)
          required: false
          schema:
            type: string
            example: "true"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  example: "+221754579919"
                  description: Numéro de téléphone sénégalais (format +2217XXXXXXX)
      responses:
        '200':
          description: OTP envoyé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestSuccess'
        '400':
          description: Numéro de téléphone invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/verify-otp:
    post:
      summary: Vérifier l'OTP et obtenir les tokens JWT
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - otp
              properties:
                phone:
                  type: string
                  example: "+221754579919"
                  description: Numéro de téléphone utilisé pour la demande OTP
                otp:
                  type: string
                  example: "123456"
                  description: Code OTP à 6 chiffres reçu par SMS
      responses:
        '200':
          description: Authentification réussie - Tokens JWT générés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifySuccess'
        '401':
          description: Code OTP invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transaction/payment:
    post:
      summary: Effectuer un paiement vers un marchand
      tags:
        - Transactions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - merchant_code
              properties:
                amount:
                  type: number
                  example: 5000
                  description: Montant du paiement en FCFA
                merchant_code:
                  type: string
                  example: "MCH123456"
                  description: Code du marchand
                merchant_phone:
                  type: string
                  example: "+221799999999"
                  description: Numéro de téléphone du marchand
                description:
                  type: string
                  example: "Paiement de facture"
                  description: Description optionnelle
      responses:
        '200':
          description: Paiement réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSuccess'
        '400':
          description: Erreur de paiement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /balance:
    get:
      summary: Vérifier le solde du wallet
      tags:
        - Wallet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Solde récupéré avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSuccess'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transaction/transfer:
    post:
      summary: Effectuer un transfert vers un autre utilisateur
      tags:
        - Transactions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - recipient_phone
              properties:
                amount:
                  type: number
                  example: 2500
                  description: Montant du transfert en FCFA
                recipient_phone:
                  type: string
                  example: "+221788888888"
                  description: Numéro du destinataire
                description:
                  type: string
                  example: "Transfert d'argent"
                  description: Description optionnelle
      responses:
        '200':
          description: Transfert réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferSuccess'
        '400':
          description: Erreur de transfert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /qr-payment:
    get:
      summary: Générer un QR code de paiement
      tags:
        - QR Code
      security:
        - bearerAuth: []
      responses:
        '200':
          description: QR code généré avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrCodeSuccess'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Wallet non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Connexion réussie"
        data:
          type: object
          properties:
            token:
              type: string
              example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9..."
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                masked_phone:
                  type: string
                  example: "******4567"
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Une erreur est survenue"
        errors:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

    PaymentSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Paiement effectué avec succès"
        data:
          type: object
          properties:
            transaction_id:
              type: string
              format: uuid
              example: "026f31bb-2746-4c8a-a54b-cd2a7a44b13a"
            new_balance:
              type: number
              example: 10000
            reference:
              type: string
              example: "TX202511091234567890"
        timestamp:
          type: string
          format: date-time

    BalanceSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Solde récupéré avec succès"
        data:
          type: object
          properties:
            balance:
              type: number
              example: 15000
            currency:
              type: string
              example: "FCFA"
        timestamp:
          type: string
          format: date-time

    TransferSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Transfert effectué avec succès"
        data:
          type: object
          properties:
            transaction_id:
              type: string
              format: uuid
              example: "12345678-1234-1234-1234-123456789012"
            new_balance:
              type: number
              example: 10000
            reference:
              type: string
              example: "TX202511091234567891"
        timestamp:
          type: string
          format: date-time

    OtpRequestSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Code OTP envoyé avec succès"
        data:
          type: object
          properties:
            message:
              type: string
              example: "Code OTP envoyé avec succès"
            phone:
              type: string
              example: "+221754579919"
        timestamp:
          type: string
          format: date-time

    OtpVerifySuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Authentification réussie"
        data:
          type: object
          properties:
            access_token:
              type: string
              description: Token JWT d'accès (valable 1 heure)
              example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9..."
            refresh_token:
              type: string
              description: Token de rafraîchissement (valable 30 jours)
              example: "uuid_du_refresh_token"
            token_type:
              type: string
              example: "Bearer"
            expires_in:
              type: integer
              description: Durée de validité en secondes
              example: 3600
        timestamp:
          type: string
          format: date-time

    QrCodeSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "QR code de paiement généré avec succès"
        data:
          type: object
          properties:
            qr_code:
              type: string
              description: QR code en base64
              example: "iVBORw0KGgoAAAANSUhEUgAA..."
            wallet_id:
              type: string
              format: uuid
              example: "12345678-1234-1234-1234-123456789012"
            format:
              type: string
              example: "base64"
            mime_type:
              type: string
              example: "image/png"
        timestamp:
          type: string
          format: date-time

