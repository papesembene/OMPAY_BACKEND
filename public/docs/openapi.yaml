openapi: 3.0.3
info:
  title: OMPAY API
  version: 1.0.0
  description: >
    API de paiement mobile simulant les fonctionnalités d’Orange Money :
    authentification, paiements, transferts et consultation de solde.

servers:
  - url: https://ompay-backend.onrender.com/api/v1
    description: Production
  - url: http://localhost:8000/api/v1
    description: Local

paths:
  /auth/request-otp:
    post:
      summary: Demander un OTP pour l'authentification 2FA
      tags:
        - Authentification
      parameters:
        - name: debug
          in: query
          description: Mode debug pour afficher l'OTP en production (uniquement pour tests)
          required: false
          schema:
            type: string
            example: "true"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  example: "+221754579919"
                  description: Numéro de téléphone sénégalais (format +2217XXXXXXX)
      responses:
        '200':
          description: OTP envoyé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestSuccess'
        '400':
          description: Numéro de téléphone invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/verify-otp:
    post:
      summary: Vérifier l'OTP et obtenir les tokens JWT
      tags:
        - Authentification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - otp
              properties:
                phone:
                  type: string
                  example: "+221754579919"
                  description: Numéro de téléphone utilisé pour la demande OTP
                otp:
                  type: string
                  example: "123456"
                  description: Code OTP à 6 chiffres reçu par SMS
      responses:
        '200':
          description: Authentification réussie - Tokens JWT générés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifySuccess'
        '401':
          description: Code OTP invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Utilisateur non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      summary: Récupérer le profil complet de l'utilisateur connecté
      tags:
        - Authentification
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil utilisateur récupéré avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileSuccess'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transaction/payment:
    post:
      summary: Effectuer un paiement vers un marchand
      tags:
        - Transactions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - merchant_code
              properties:
                amount:
                  type: number
                  example: 5000
                  description: Montant du paiement en FCFA
                merchant_code:
                  type: string
                  example: "MCH123456"
                  description: Code du marchand
                merchant_phone:
                  type: string
                  example: "+221799999999"
                  description: Numéro de téléphone du marchand
                description:
                  type: string
                  example: "Paiement de facture"
                  description: Description optionnelle
      responses:
        '200':
          description: Paiement réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSuccess'
        '400':
          description: Erreur de paiement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /balance:
    get:
      summary: Vérifier les soldes des wallets
      tags:
        - Wallet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Soldes récupérés avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSuccess'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Aucun wallet trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /balance/{reference}:
    get:
      summary: Vérifier le solde d'un wallet spécifique
      tags:
        - Wallet
      security:
        - bearerAuth: []
      parameters:
        - name: reference
          in: path
          required: true
          description: "Référence du wallet (ex: principal, epargne)"
          schema:
            type: string
            example: "principal"
      responses:
        '200':
          description: Solde du wallet récupéré avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalanceSuccess'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Wallet non trouvé ou accès non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transaction/transfer:
    post:
      summary: Effectuer un transfert vers un autre utilisateur
      tags:
        - Transactions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - recipient_phone
              properties:
                amount:
                  type: number
                  example: 2500
                  description: Montant du transfert en FCFA
                recipient_phone:
                  type: string
                  example: "+221788888888"
                  description: Numéro du destinataire
                description:
                  type: string
                  example: "Transfert d'argent"
                  description: Description optionnelle
      responses:
        '200':
          description: Transfert réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferSuccess'
        '400':
          description: Erreur de transfert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /qr-payment:
    get:
      summary: Générer un QR code de paiement
      tags:
        - QR Code
      security:
        - bearerAuth: []
      responses:
        '200':
          description: QR code généré avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrCodeSuccess'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Wallet non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transactions/history:
    get:
      summary: Récupérer l'historique complet des transactions avec pagination et filtres
      tags:
        - Transactions
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Numéro de la page (défaut 1)
          required: false
          schema:
            type: integer
            minimum: 1
            example: 1
        - name: per_page
          in: query
          description: Nombre d'éléments par page (défaut 20, max 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 20
        - name: type
          in: query
          description: Filtrer par type de transaction
          required: false
          schema:
            type: string
            enum: [payment, transfer]
            example: "payment"
        - name: status
          in: query
          description: Filtrer par statut
          required: false
          schema:
            type: string
            enum: [pending, success, failed]
            example: "success"
        - name: date_from
          in: query
          description: Date de début (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
            example: "2025-01-01"
        - name: date_to
          in: query
          description: Date de fin (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
            example: "2025-12-31"
        - name: sort_by
          in: query
          description: Champ de tri
          required: false
          schema:
            type: string
            enum: [created_at, amount, type]
            example: "created_at"
        - name: sort_order
          in: query
          description: Ordre de tri
          required: false
          schema:
            type: string
            enum: [asc, desc]
            example: "desc"
      responses:
        '200':
          description: Historique récupéré avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistorySuccess'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transactions/recent:
    get:
      summary: Récupérer les 10 dernières transactions
      tags:
        - Transactions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Transactions récentes récupérées avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRecentSuccess'
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Connexion réussie"
        data:
          type: object
          properties:
            token:
              type: string
              example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9..."
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                masked_phone:
                  type: string
                  example: "******4567"
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Une erreur est survenue"
        errors:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

    PaymentSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Paiement effectué avec succès"
        data:
          type: object
          properties:
            id_transaction:
              type: string
              format: uuid
              example: "026f31bb-2746-4c8a-a54b-cd2a7a44b13a"
            montant_signe:
              type: string
              example: "-5 000 FCFA"
            expediteur:
              type: string
              example: "Pape Sembene"
            numero_expediteur:
              type: string
              example: "+221771234567"
            destinataire:
              type: string
              example: "Auchan Sandaga"
            numero_destinataire:
              type: string
              nullable: true
              example: "+221701234567"
            nouveau_solde:
              type: number
              example: 10000
            reference:
              type: string
              example: "TX202511091234567890"
        timestamp:
          type: string
          format: date-time

    BalanceSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Soldes récupérés avec succès"
        data:
          type: object
          properties:
            wallets:
              type: array
              items:
                type: object
                properties:
                  reference:
                    type: string
                    example: "principal"
                  label:
                    type: string
                    example: "Compte Principal"
                  balance:
                    type: number
                    example: 10000
                  currency:
                    type: string
                    example: "XOF"
                  is_primary:
                    type: boolean
                    example: true
        timestamp:
          type: string
          format: date-time

    WalletBalanceSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Solde du wallet récupéré avec succès"
        data:
          type: object
          properties:
            reference:
              type: string
              example: "principal"
            label:
              type: string
              example: "Compte Principal"
            balance:
              type: number
              example: 10000
            currency:
              type: string
              example: "XOF"
            is_primary:
              type: boolean
              example: true
        timestamp:
          type: string
          format: date-time

    TransferSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Transfert effectué avec succès"
        data:
          type: object
          properties:
            id_transaction:
              type: string
              format: uuid
              example: "12345678-1234-1234-1234-123456789012"
            montant_signe:
              type: string
              example: "-2 000 FCFA"
            expediteur:
              type: string
              example: "Pape Sembene"
            numero_expediteur:
              type: string
              example: "+221771234567"
            destinataire:
              type: string
              example: "Awa Diop"
            numero_destinataire:
              type: string
              example: "+221781112233"
            nouveau_solde:
              type: number
              example: 10000
            reference:
              type: string
              example: "TX202511091234567891"
        timestamp:
          type: string
          format: date-time

    OtpRequestSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Code OTP envoyé avec succès"
        data:
          type: object
          properties:
            message:
              type: string
              example: "Code OTP envoyé avec succès"
            phone:
              type: string
              example: "+221754579919"
        timestamp:
          type: string
          format: date-time

    OtpVerifySuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Authentification réussie"
        data:
          type: object
          properties:
            access_token:
              type: string
              description: Token JWT d'accès (valable 1 heure)
              example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9..."
            refresh_token:
              type: string
              description: Token de rafraîchissement (valable 30 jours)
              example: "uuid_du_refresh_token"
            token_type:
              type: string
              example: "Bearer"
            expires_in:
              type: integer
              description: Durée de validité en secondes
              example: 3600
        timestamp:
          type: string
          format: date-time

    UserProfileSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Profil utilisateur récupéré avec succès"
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: "12345678-1234-1234-1234-123456789012"
                name:
                  type: string
                  example: "Pape Sembene"
                phone:
                  type: string
                  example: "+221754579919"
            wallets:
              type: array
              items:
                type: object
                properties:
                  reference:
                    type: string
                    example: "principal"
                  label:
                    type: string
                    example: "Compte Principal"
                  balance:
                    type: number
                    example: 10000.00
                  currency:
                    type: string
                    example: "XOF"
                  is_primary:
                    type: boolean
                    example: true
            recent_transactions:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: "12345678-1234-1234-1234-123456789012"
                  signed_amount:
                    type: string
                    example: "-5 000 FCFA"
                  sender:
                    type: string
                    example: "Pape Sembene (+221771234567)"
                  recipient:
                    type: string
                    example: "Test Merchant (MCH123456)"
                  description:
                    type: string
                    example: "Paiement effectué vers Test Merchant"
                  status:
                    type: string
                    example: "success"
                  reference:
                    type: string
                    example: "TX202511091234567890"
                  created_at:
                    type: string
                    format: date-time
                    example: "2025-11-10T09:30:19.000000Z"
                  updated_at:
                    type: string
                    format: date-time
                    example: "2025-11-10T09:30:19.000000Z"
        timestamp:
          type: string
          format: date-time

    QrCodeSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "QR code de paiement généré avec succès"
        data:
          type: object
          properties:
            qr_code:
              type: string
              description: QR code en base64
              example: "iVBORw0KGgoAAAANSUhEUgAA..."
            wallet_id:
              type: string
              format: uuid
              example: "12345678-1234-1234-1234-123456789012"
            format:
              type: string
              example: "base64"
            mime_type:
              type: string
              example: "image/png"
        timestamp:
          type: string
          format: date-time

    TransactionHistorySuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Historique des transactions récupéré avec succès"
        data:
          type: object
          properties:
            transactions:
              type: array
              items:
                $ref: '#/components/schemas/TransactionItem'
            pagination:
              type: object
              properties:
                current_page:
                  type: integer
                  example: 1
                last_page:
                  type: integer
                  example: 5
                per_page:
                  type: integer
                  example: 20
                total:
                  type: integer
                  example: 87
                from:
                  type: integer
                  example: 1
                to:
                  type: integer
                  example: 20
            filters:
              type: object
              properties:
                type:
                  type: string
                  nullable: true
                  example: "payment"
                status:
                  type: string
                  nullable: true
                  example: "success"
                date_from:
                  type: string
                  format: date
                  nullable: true
                  example: "2025-01-01"
                date_to:
                  type: string
                  format: date
                  nullable: true
                  example: "2025-12-31"
                sort_by:
                  type: string
                  example: "created_at"
                sort_order:
                  type: string
                  example: "desc"
        timestamp:
          type: string
          format: date-time

    TransactionRecentSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Transactions récentes récupérées avec succès"
        data:
          type: object
          properties:
            transactions:
              type: array
              items:
                $ref: '#/components/schemas/TransactionItem'
            count:
              type: integer
              example: 8
        timestamp:
          type: string
          format: date-time

    TransactionItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "12345678-1234-1234-1234-123456789012"
        signed_amount:
          type: string
          example: "-2 500 FCFA"
        sender:
          type: string
          example: "Pape Sembene (+221771234567)"
        recipient:
          type: string
          example: "Awa Diop (+221781112233)"
        description:
          type: string
          example: "Transfert envoyé vers +221781112233"
        status:
          type: string
          enum: [pending, success, failed]
          example: "success"
        reference:
          type: string
          nullable: true
          example: "TX202511091234567891"
        created_at:
          type: string
          format: date-time
          example: "2025-11-10T14:30:00.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-10T14:30:00.000000Z"

